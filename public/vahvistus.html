<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tilausvahvistus – Mattorundi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><div class="wrap"><a class="logo" href="/"><b>MATTO</b>RUNDI</a></div></header>
<section><div class="wrap">
<div class="noprint" id="actions" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px">
  <button class="btn btn-g" type="button" id="mail" style="flex:1 1 220px">Lähetä sähköpostilla</button>
  <button class="btn btn-n" type="button" onclick="print()" style="flex:1 1 220px">Tulosta / tallenna PDF</button>
</div>
<p class="noprint" style="margin:0 0 8px;font-size:14px">Asiakas saa lyhyen viestin ja tilausvahvistuksen PDF-liitteenä. Älä lähetä tätä sivua asiakkaalle.</p>
<p class="noprint" id="mailMsg" role="status" aria-live="polite" style="margin:0 0 16px;font-size:14px"></p>
<div class="card" id="c">Ladataan…</div>
</div></section>
<script src="common.js"></script><script src="terms.js"></script><script>
(async()=>{
const id=new URLSearchParams(location.search).get('id');
try{
const o=await api('/api/orders/'+id);
const rows=[
  o.medium?`<tr><td>Keskikokoinen matto (1–2,4 m²)</td><td>${o.medium}</td><td>${eur(o.priceMedium)}</td><td>${eur(o.medium*o.priceMedium)}</td></tr>`:'',
  o.large?`<tr><td>Iso matto (2,5–3,5 m²)</td><td>${o.large}</td><td>${eur(o.priceLarge)}</td><td>${eur(o.large*o.priceLarge)}</td></tr>`:'',
  (o.extrasHair||0)?`<tr><td>Karvanpoisto (per matto)</td><td>${o.extrasHair}</td><td>${eur(10)}</td><td>${eur(10*(+o.extrasHair||0))}</td></tr>`:'',
  (o.extrasOdor||0)?`<tr><td>Hajunpoisto (kaikki matot)</td><td>1</td><td>${eur(10)}</td><td>${eur(10)}</td></tr>`:''
].join('');
$('#c').innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><span class="logo" style="color:var(--navy)"><b>MATTO</b>RUNDI</span><h2>Tilausvahvistus ${o.number}</h2></div><div style="text-align:right;font-size:14px">${COMPANY.name}<br>Perustajat: ${COMPANY.founders}<br>Y-tunnus: ${COMPANY.ytunnus}<br>${COMPANY.address}<br>${COMPANY.email} · ${COMPANY.phone}</div></div>
<div class="row"><div><h3>Asiakas</h3>${o.name}<br>${o.address}<br>${o.postal||''} ${o.city||''}<br>${o.phone}<br>${o.email||''}</div>
<div><h3>Tilaus</h3>Sopimuspäivä: ${new Date(o.createdAt).toLocaleString('fi-FI')}<br>Myyntitapa: ${o.channel==='kotimyynti'?'kotimyynti, myyjä '+o.sellerCode:'verkkovaraus'}<br><b>Nouto: ${fmtD(o.pickupDate)} ${o.pickupTime||''}</b><br><b>Arvioitu palautus: ${fmtD(o.returnDate)}</b><br>Maksu: ${o.payment}</div></div>
<table style="margin-top:16px"><tr><th>Palvelu</th><th>Kpl</th><th>á</th><th>Yhteensä</th></tr>${rows}<tr><td colspan="3"><b>Yhteensä (sis. ALV ${String(o.vatPct).replace('.',',')} %)</b></td><td><b>${eur(o.total)}</b></td></tr><tr><td colspan="3">josta ALV</td><td>${eur(o.vat)}</td></tr></table>
<p style="font-size:14px">Hinta sisältää noudon, pesun, kuivauksen ja palautuksen.${o.notes?'<br>Lisätiedot: '+o.notes.replace(/</g,'&lt;'):''}</p>
<p><b>Peruuttamisoikeus:</b> Voit peruuttaa sopimuksen ilmoittamatta syytä 14 päivän kuluessa sopimuspäivästä eli viimeistään ${new Date(new Date(o.createdAt).getTime()+14*864e5).toLocaleDateString('fi-FI')}. Ilmoita sähköpostilla ${COMPANY.email} tai puhelimella ${COMPANY.phone}, tai käytä alla olevaa peruutuslomaketta.
${o.startEarly?'<br>Asiakas on pyytänyt palvelun aloittamista peruuttamisaikana (ks. ehtojen kohta 7).':''}</p>
${o.signature?`<p><b>Asiakkaan allekirjoitus:</b><br><img src="${o.signature}" style="max-width:320px;border-bottom:1px solid #333"></p>`:''}
<div class="pb"><h2>Tilausehdot</h2>${TERMS_HTML}</div><div class="pb" style="border-top:2px dashed #999;margin-top:24px;padding-top:12px">${CANCEL_FORM_HTML(o)}</div>`;

const mailBtn=$('#mail'), mailMsg=$('#mailMsg');
if(!o.email){ mailBtn.disabled=true; mailBtn.title='Tilauksella ei ole sähköpostiosoitetta'; mailMsg.textContent='Asiakkaalla ei ole sähköpostia tilauksella. Tulosta vahvistus tai lisää sähköpostiosoite.'; }
mailBtn.onclick=async()=>{
  if(!o.email){ mailMsg.innerHTML='<span class="err">Tilauksella ei ole sähköpostiosoitetta.</span>'; return; }
  mailBtn.disabled=true; mailMsg.textContent='Lähetetään…';
  try{
    await api('/api/orders/'+id+'/email',{method:'POST',body:JSON.stringify({})});
    mailMsg.innerHTML='<span style="color:var(--green,#0F3B2C);font-weight:700">Lähetetty osoitteeseen '+o.email+'. Asiakas saa tilausvahvistuksen PDF-liitteenä.</span>';
    mailBtn.textContent='Lähetetty';
  }catch(err){
    mailMsg.innerHTML='<span class="err">'+(err.message||'Lähetys epäonnistui')+'</span>';
    mailBtn.disabled=false;
  }
};
}catch(e){$('#c').innerHTML='<span class="err">'+e.message+'</span>';$('#actions').style.display='none'}})()
</script></body></html>
